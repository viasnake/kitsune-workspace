pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 10s;
    send_timeout 10s;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    limit_conn_zone $binary_remote_addr zone=agent_connections:1m;
    limit_req_zone $binary_remote_addr zone=agent_requests:1m rate=20r/s;

    server {
        listen 172.31.242.10:18081;

        location = /api/agent/register {
            if ($request_method != POST) { return 405; }
            if ($is_args != "") { return 400; }
            include /etc/nginx/agent-proxy.inc;
        }

        location = /api/agent/heartbeat {
            if ($request_method != POST) { return 405; }
            if ($is_args != "") { return 400; }
            include /etc/nginx/agent-proxy.inc;
        }

        location = /api/agent/events/batch {
            if ($request_method != POST) { return 405; }
            if ($is_args != "") { return 400; }
            include /etc/nginx/agent-proxy.inc;
        }

        location = /api/agent/runs/begin {
            if ($request_method != POST) { return 405; }
            if ($is_args != "") { return 400; }
            include /etc/nginx/agent-proxy.inc;
        }

        location ~ "^/api/agent/runs/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/input$" {
            if ($request_method != GET) { return 405; }
            if ($is_args != "") { return 400; }
            include /etc/nginx/agent-proxy.inc;
        }

        location ~ "^/api/agent/runs/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/ack$" {
            if ($request_method != POST) { return 405; }
            if ($is_args != "") { return 400; }
            include /etc/nginx/agent-proxy.inc;
        }

        location / {
            return 404;
        }
    }
}
