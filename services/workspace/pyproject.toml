[project]
name = "kitsune-workspace"
version = "1.0.0"
description = "Kitsune Workspace control plane"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "alembic>=1.15,<2",
  "croniter>=6,<7",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "kitsune-contracts>=1.0.0,<2",
  "kitsune-sdk>=1.0.0,<2",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
kitsune = "kitsune.cli:main"

[project.optional-dependencies]
test = [
  "hypothesis>=6.130,<7",
  "pyright>=1.1.410,!=1.1.411,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kitsune_workspace"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "kitsune_workspace/alembic.ini"
"migrations" = "kitsune_workspace/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "postgresql: requires a live PostgreSQL URL in KITSUNE_TEST_POSTGRES_URL",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src"]
