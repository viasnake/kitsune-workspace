[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kitsune-sdk"
version = "1.0.0"
description = "In-process lifecycle and observability SDK for Kitsune Agent Applications"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "anyio>=4.8,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "kitsune-contracts>=1.0.0",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-exporter-otlp>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6.125",
  "pytest>=9.0.3",
  "pytest-asyncio>=0.25",
]

[project.scripts]
kitsune = "kitsune.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kitsune"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
