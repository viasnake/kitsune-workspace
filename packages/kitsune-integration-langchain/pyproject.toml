[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kitsune-integration-langchain"
version = "1.0.0"
description = "LangChain Runnable, callback, usage, tracing, streaming, and budget integration for Kitsune"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "kitsune-contracts>=1.0.0",
  "kitsune-sdk>=1.0.0",
  "langchain>=1,<2",
  "langchain-core>=1,<2",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pytest-asyncio>=0.25"]

[tool.hatch.build.targets.wheel]
packages = ["src/kitsune_langchain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
